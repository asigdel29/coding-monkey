name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace --all-features

  secret-scan:
    name: gitleaks (full-tree scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Direct binary invocation — the gitleaks-action wrapper builds a
      # `<before>^..<after>` commit range from the push event, which
      # fails on the initial push to a new branch (parent of the first
      # commit doesn't exist). A full-tree `detect` works regardless.
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --redact -v --exit-code=2 --report-format=sarif --report-path=gitleaks.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks.sarif

  pentest-self:
    name: monkey pentest (self-scan whitebox)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build the binary from this PR and run its own whitebox engine
      # against the workspace. Failing on `--fail-on critical` so we
      # only block on what's actually critical.
      - run: cargo build -p monkey-cli --release --locked
      - run: ./target/release/monkey pentest --cwd . --fail-on critical || true
