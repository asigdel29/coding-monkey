name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, archive: tar.gz, cross: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: zip }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compile linker (linux-aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: cargo build (release)
        run: cargo build -p monkey-cli --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="monkey-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$NAME"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/monkey.exe" "$NAME/"
          else
            cp "target/${{ matrix.target }}/release/monkey" "$NAME/"
          fi
          cp README.md LICENSE "$NAME/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${NAME}.zip" "$NAME"
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |
            monkey-*.tar.gz
            monkey-*.zip
            *.sha256
