# File: deny.toml
#
# cargo-deny configuration: license, advisory, and source policies.
# Run via `cargo deny check` locally and on CI (security workflow).
#
# History
# 2026-05-05  Anubhav Sigdel  initial gauntlet

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Each entry is an *unmaintained* advisory on a transitive dep with no
# safe upgrade. We accept the risk and revisit when the upstream chain
# (leptos / indicatif / portable-pty / gloo) cuts a release that drops
# the dep. Re-audit quarterly.
ignore = [
    # bincode 1.3.x — pulled in by gloo-worker → gloo → monkey-web.
    # gloo 0.11 still pins it; no upgrade path until gloo 0.12.
    "RUSTSEC-2025-0141",
    # number_prefix 0.4 — pulled in by indicatif (CLI progress bars).
    # indicatif has no maintained replacement on the 0.17 line.
    "RUSTSEC-2025-0119",
    # paste 1.0.x — deeply embedded in leptos / tachys / reactive_stores.
    # No drop-in replacement that the leptos ecosystem has migrated to.
    "RUSTSEC-2024-0436",
    # serial 0.4 — transitive of portable-pty 0.8 (via monkey-deck and
    # monkey-agents). portable-pty hasn't shipped a release that drops
    # `serial`; switching pty crate is a separate cleanup.
    "RUSTSEC-2017-0008",
    # proc-macro-error2 2.0.x — transitive of leptos_macro / reactive_stores
    # (monkey-web). Like `paste`, waiting on the leptos ecosystem to migrate.
    "RUSTSEC-2026-0173",
]

[licenses]
# Allowlist the licenses we accept. New deps that aren't on this list
# fail CI loudly, forcing an explicit decision instead of silent
# license drift.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # BSL-1.0: Boost Software License — OSI-approved, permissive.
    # Pulled in by leptos's xxhash-rust (transitive via server_fn).
    "BSL-1.0",
    # CDLA-Permissive-2.0: Community Data License Agreement, permissive.
    # Pulled in by webpki-roots (transitive via reqwest, hyper-rustls,
    # tokio-tungstenite). The license body is functionally MIT-equivalent
    # for code; it exists primarily for data sets but webpki-roots ships
    # the Mozilla CA bundle under it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
# Catch accidental duplicate versions of the same crate after a Cargo
# update — they bloat the binary and slow builds.
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "../foo"` deps look like wildcards to
# cargo-deny because they have no version constraint. They aren't —
# they're sibling crates we control. This flag exempts them while
# still blocking real wildcard ("*") version reqs from crates.io.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
