# File: Cargo.toml
#
# Purpose
#   Cargo workspace root. Each `crates/<name>/` is an independent Rust crate
#   with its own Cargo.toml. Dependencies between in-tree crates use
#   `path = "../<name>"` so changes propagate without re-publishing.
#
# History
# Date         Author          Changes
# 2026-05-05   Anubhav Sigdel  initial Rust workspace scaffold
# 2026-06-09   Anubhav Sigdel  add crates/runtime (native in-process agents)

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/agents",
    "crates/engulf",
    "crates/skills",
    "crates/pentest-agent",
    "crates/runtime",
    "crates/deck",
    "crates/cli",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Anubhav Sigdel <anu@getlora.com>"]
repository = "https://github.com/asigdel29/coding-monkey"
# Internal-only — these crates use intra-workspace `path = "..."` deps,
# which crates.io rejects. Marking them unpublishable also tells
# cargo-deny they're private (so `allow-wildcard-paths` applies).
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# Errors and logs
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI / TTY
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16"
indicatif = "0.18"
dialoguer = "0.12"

# Crypto / hashing
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
hex = "0.4"

# HTTP / WebSocket
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# PTY
portable-pty = "0.9"

# Filesystem / paths
walkdir = "2.5"
ignore = "0.4"
glob = "0.3"
tempfile = "3.13"

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }

# Regex / patterns
regex = "1.11"
once_cell = "1.20"

# System capacity probing (RAM/CPU) for the agent concurrency cap
sysinfo = "0.33"

# Testing
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Unwind (not abort) so a panicking native agent is contained by the
# scheduler instead of taking down the whole process — essential when 100+
# agents share one runtime. Costs a little binary size for landing pads.
panic = "unwind"

[profile.dev]
opt-level = 0
debug = true
